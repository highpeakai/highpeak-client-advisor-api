openapi: 3.0.3
info:
  title: HighPeak API
  description: |
    Long-term care (LTC), longevity and healthcare cost estimates from HighPeak's models.

    ## Getting started
    Your base URL, API key and account are provided during onboarding. All endpoints are `POST` requests with a JSON body.

    ## Authentication
    Every request needs **both** headers:

    | Header | Value |
    | --- | --- |
    | `X-API-Key` | Your API key |
    | `Authorization` | `Bearer <access token>` for your HighPeak account with API access |

    A missing or invalid API key returns **403**. A missing, expired or invalid access token returns **401**. Access tokens expire after about an hour.

    ## Request body
    All endpoints accept the same input template, so you can send one body to every endpoint.
    - **Required fields** must be present and non-empty. They differ by endpoint (see each endpoint).
    - **Optional fields** can be left out or sent as an empty string (`""`). They're treated as unknown, and the models estimate them from people with a similar profile. The more you provide, the more specific the estimate.
    - **Fields an endpoint doesn't use** are ignored.
    - Text values are **lowercase**, for example `"female"`, `"very good"`, `"no"`.
    - **Use only the values listed for each field.** Unrecognized values in optional fields aren't rejected; they're replaced with default values, which changes the estimate.

    | Endpoint | Required fields |
    | --- | --- |
    | `/queries/ltc/probability` | `age`, `gender`, `zipcode`, `overall_rating` |
    | `/queries/ltc/service_type` | `age`, `gender`, `zipcode`, `overall_rating` |
    | `/queries/ltc/cost` | `zipcode` |
    | `/queries/ltc/duration` | `age`, `gender`, `zipcode`, `overall_rating` |
    | `/queries/longevity/estimate` | `age`, `gender`, `zipcode`, `overall_rating` |
    | `/queries/healthcare/cost` | `age`, `gender`, `zipcode`, `overall_rating` |

    ## Errors
    | Status | Meaning |
    | --- | --- |
    | 400 | Invalid request: malformed JSON, a missing required field, or a value that can't be used. The `message` says what's wrong. |
    | 401 | Missing, expired or invalid access token |
    | 403 | Missing or invalid API key, or account not permitted |
    | 429 | Rate limit or monthly quota for your API key exceeded |
    | 500 | The estimate couldn't be generated. Retry, and contact HighPeak if it persists. |

    Error responses have the form `{"message": "..."}`.
  version: 1.0.0
servers: []
tags:
  - name: LTC Queries
    description: Endpoints for long-term care probability, type, cost, duration, and longevity predictions

security:
  - api_key: []
    bearer_token: []

paths:
  /queries/ltc/probability:
    post:
      tags: [LTC Queries]
      summary: Estimate long-term care need probability
      description: |
        Estimates the chance (%) that the person will need long-term care.

        **Required:** `age`, `gender`, `zipcode`, `overall_rating`. Optional health and lifestyle fields refine the estimate.
      operationId: queryProbability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LtcProbabilityInput"
            examples:
              minimum:
                summary: Required fields only
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
              detailed:
                summary: Required fields plus health and lifestyle
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
                  body_weight: 160
                  body_height_ft: 5
                  body_height_in: 8
                  job: "retired"
                  marry: "married"
                  smoke: "no"
                  drink_alcohol: "no"
                  troubled_with_pain: "no"
                  arthritis: "yes"
                  high_blood_pressure: "yes"
                  high_cholesterol: "no"
                  diabetes: "no"
                  heart_condition: "no"
                  stroke: "no"
                  lung_condition: "no"
                  cancer: "no"
                  alzheimers: "no"
                  dementia: "no"
                  depression: "no"
                  emotional_problems: "no"
                  cognitive_limitation: "no"
      responses:
        "200":
          description: >-
            `proba_mean` is the estimated chance (%) of needing long-term care, and `proba_std` is how much that varies across the simulated scenarios. `count` is the number of scenarios used to fill in unanswered inputs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ltc_need_proba:
                    type: object
                    properties:
                      proba_mean:
                        type: number
                        example: 64
                      proba_std:
                        type: number
                        example: 13
                      count:
                        type: integer
                        example: 10000
                      unit:
                        type: string
                        example: "%"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /queries/ltc/service_type:
    post:
      tags: [LTC Queries]
      summary: Estimate long-term care service type probabilities
      description: |
        Estimates which type of long-term care the person is most likely to use: home health care, assisted living facility or nursing home.

        **Required:** `age`, `gender`, `zipcode`, `overall_rating`. Optional health and lifestyle fields refine the estimate.
      operationId: queryServiceType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LtcTypeInput"
            examples:
              minimum:
                summary: Required fields only
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
              detailed:
                summary: Required fields plus health and lifestyle
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
                  body_weight: 160
                  body_height_ft: 5
                  body_height_in: 8
                  job: "retired"
                  marry: "married"
                  smoke: "no"
                  drink_alcohol: "no"
                  troubled_with_pain: "no"
                  arthritis: "yes"
                  high_blood_pressure: "yes"
                  high_cholesterol: "no"
                  diabetes: "no"
                  heart_condition: "no"
                  stroke: "no"
                  lung_condition: "no"
                  cancer: "no"
                  alzheimers: "no"
                  dementia: "no"
                  depression: "no"
                  emotional_problems: "no"
                  cognitive_limitation: "no"
      responses:
        "200":
          description: >-
            For each care type, `proba_mean` is the chance (%) it's the type of care used and `proba_std` is how much that varies across the simulated scenarios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ltc_service_type_proba:
                    type: object
                    properties:
                      homeHealthCare:
                        type: object
                        properties:
                          proba_mean:
                            type: number
                            example: 17
                          proba_std:
                            type: number
                            example: 15
                      assistedLivingFacility:
                        type: object
                        properties:
                          proba_mean:
                            type: number
                            example: 83
                          proba_std:
                            type: number
                            example: 15
                      nursingHome:
                        type: object
                        properties:
                          proba_mean:
                            type: number
                            example: 0
                          proba_std:
                            type: number
                            example: 0
                      count:
                        type: integer
                        example: 10000
                      unit:
                        type: string
                        example: "%"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /queries/ltc/cost:
    post:
      tags: [LTC Queries]
      summary: Estimate long-term care costs by facility type
      description: |
        Returns the monthly cost of each type of long-term care for the state the ZIP code is in.

        **Required:** `zipcode`. Other fields are accepted and ignored.
      operationId: queryCost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LtcCostInput"
            examples:
              minimum:
                summary: ZIP code only
                value:
                  zipcode: "10010"
      responses:
        "200":
          description: >-
            Monthly cost in US dollars: `HHC` home health care, `ALF` assisted living facility, `NH` nursing home.
          content:
            application/json:
              schema:
                type: object
                properties:
                  HHC:
                    type: number
                    description: Home Health Care monthly cost
                    example: 6769.0
                  ALF:
                    type: number
                    description: Assisted Living Facility monthly cost
                    example: 7400.0
                  NH:
                    type: number
                    description: Nursing Home monthly cost
                    example: 12159.0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /queries/ltc/duration:
    post:
      tags: [LTC Queries]
      summary: Estimate long-term care duration
      description: |
        Estimates how long the person would need long-term care.

        **Required:** `age`, `gender`, `zipcode`, `overall_rating`. Optional fields refine the estimate.
      operationId: queryDuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LtcDurationInput"
            examples:
              minimum:
                summary: Required fields only
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
              detailed:
                summary: Required fields plus health and income
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
                  marry: "married"
                  income: 75000
                  arthritis: "yes"
                  high_blood_pressure: "yes"
                  heart_condition: "no"
                  stroke: "no"
                  diabetes: "no"
                  cancer: "no"
                  alzheimers: "no"
                  dementia: "no"
                  lung_condition: "no"
      responses:
        "200":
          description: >-
            The arrays line up by position: there's a `proba[i]`% chance of needing care for more than `dur_mean[i]` months (± `dur_std[i]`). For example, `proba[0] = 90` and `dur_mean[0] = 13` means a 90% chance of needing care for more than 13 months.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ltc_duration:
                    type: object
                    properties:
                      dur_mean:
                        type: array
                        items:
                          type: number
                        example: [13, 27, 43, 62, 84, 111, 146, 196, 280]
                      dur_std:
                        type: array
                        items:
                          type: number
                        example: [5, 11, 17, 25, 34, 45, 59, 78, 112]
                      proba:
                        type: array
                        items:
                          type: number
                        example: [90, 80, 70, 60, 50, 40, 29, 19, 10]
                      count:
                        type: integer
                        example: 100000
                      unit:
                        type: string
                        example: "months"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /queries/longevity/estimate:
    post:
      tags: [LTC Queries]
      summary: Estimate longevity distribution
      description: |
        Estimates how long the person is likely to live.

        **Required:** `age`, `gender`, `zipcode`, `overall_rating`. Optional health and lifestyle fields refine the estimate.
      operationId: queryLongevity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LtcLongevityInput"
            examples:
              minimum:
                summary: Required fields only
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
              detailed:
                summary: Required fields plus health and lifestyle
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
                  body_weight: 160
                  body_height_ft: 5
                  body_height_in: 8
                  job: "retired"
                  smoke: "no"
                  income: 75000
                  use_drugs: "no"
                  arthritis: "yes"
                  high_blood_pressure: "yes"
                  diabetes: "no"
                  heart_condition: "no"
                  stroke: "no"
                  cancer: "no"
                  renal: "no"
                  liver_disease: "no"
      responses:
        "200":
          description: >-
            The arrays line up by position: there's a `proba[i]` chance of living beyond age `age_mean[i]` (± `age_std[i]`). Note that `proba` here is a fraction (0.9 = 90%), not a percentage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  longevity:
                    type: object
                    properties:
                      age_mean:
                        type: array
                        items:
                          type: number
                        example: [74, 78, 81, 84, 86, 88, 90, 92, 95]
                      age_std:
                        type: array
                        items:
                          type: number
                        example: [2, 3, 3, 3, 3, 3, 3, 3, 2]
                      proba:
                        type: array
                        items:
                          type: number
                        example: [0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
  /queries/healthcare/cost:
    post:
      tags: [LTC Queries]
      summary: Estimate healthcare cost distribution
      description: |
        Estimates the person's healthcare costs.

        **Required:** `age`, `gender`, `zipcode`, `overall_rating`. Optional health and lifestyle fields refine the estimate.
      operationId: queryHealthcareCost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LtcHealthcareCostInput"
            examples:
              minimum:
                summary: Required fields only
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
              detailed:
                summary: Required fields plus health and lifestyle
                value:
                  age: 65
                  gender: "female"
                  zipcode: "07204"
                  overall_rating: "good"
                  body_weight: 160
                  body_height_ft: 5
                  body_height_in: 8
                  job: "retired"
                  marry: "married"
                  smoke: "no"
                  drink_alcohol: "no"
                  troubled_with_pain: "no"
                  arthritis: "yes"
                  high_blood_pressure: "yes"
                  high_cholesterol: "no"
                  diabetes: "no"
                  heart_condition: "no"
                  stroke: "no"
                  lung_condition: "no"
                  cancer: "no"
                  alzheimers: "no"
                  dementia: "no"
                  depression: "no"
                  emotional_problems: "no"
                  cognitive_limitation: "no"
      responses:
        "200":
          description: >-
            The arrays line up by position: there's a `proba[i]`% chance of healthcare costs above `cost_mean[i]` US dollars (± `cost_std[i]`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  hc_cost:
                    type: object
                    properties:
                      cost_mean:
                        type: array
                        items:
                          type: number
                        example:
                          [560, 1170, 1870, 2690, 3640, 4810, 6320, 8450, 12080]
                      cost_std:
                        type: array
                        items:
                          type: number
                        example: [30, 60, 100, 140, 190, 250, 330, 440, 620]
                      proba:
                        type: array
                        items:
                          type: number
                        example: [90, 80, 70, 60, 50, 40, 29, 19, 10]
                      count:
                        type: integer
                        example: 10000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key provided during onboarding.
    bearer_token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token for your HighPeak account with API access. Sent as `Authorization: Bearer <token>`."

  responses:
    Unauthorized:
      description: Missing, expired or invalid access token.
    Forbidden:
      description: Missing or invalid API key, or account not permitted.
    TooManyRequests:
      description: Rate limit or monthly quota for your API key exceeded.
    BadRequest:
      description: >-
        Invalid request: malformed JSON, a missing required field, or a value that can't be used.
        The `message` says what's wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Missing parameters in the request body"
    ServerError:
      description: The estimate couldn't be generated. Retry, and contact HighPeak if it persists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Problem with invoking request to model."
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    LtcProbabilityInput:
      type: object
      description: >-
        All model query endpoints accept the same input template. Fields not listed here are accepted and ignored. Optional fields left out or sent as an empty string are treated as unknown.
      required:
        - age
        - gender
        - zipcode
        - overall_rating
      properties:
        age:
          type: integer
          minimum: 18
          maximum: 80
          example: 18
        gender:
          type: string
          enum: [male, female]
          description: Lowercase.
        zipcode:
          type: string
        overall_rating:
          type: string
          enum: [excellent, very good, good, fair, poor]
        body_weight:
          type: number
          description: Body weight in pounds
        troubled_with_pain:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        job:
          type: string
          example: "employed"
          description: "Accepted values: unemployed, employed, retired, disabled, or empty string if unknown"
        arthritis:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        cognitive_limitation:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        depression:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        emotional_problems:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        marry:
          type: string
          enum: [single, married, ""]
          description: "Accepted values: single, married, or empty string if unknown"
          example: "married"
        smoke:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        heart_condition:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        high_cholesterol:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        diabetes:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        high_blood_pressure:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        stroke:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        lung_condition:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        alzheimers:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        dementia:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        cancer:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        drink_alcohol:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        body_height_in:
          type: number
          description: Body height in inches
        body_height_ft:
          type: number
          description: Body height in feet
    LtcTypeInput:
      type: object
      description: >-
        All model query endpoints accept the same input template. Fields not listed here are accepted and ignored. Optional fields left out or sent as an empty string are treated as unknown.
      required:
        - age
        - gender
        - zipcode
        - overall_rating
      properties:
        age:
          type: integer
          minimum: 18
          maximum: 80
          example: 18
        gender:
          type: string
          enum: [male, female]
          description: Lowercase.
        zipcode:
          type: string
        overall_rating:
          type: string
          enum: [excellent, very good, good, fair, poor]
        body_weight:
          type: number
          description: Body weight in pounds
        troubled_with_pain:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
