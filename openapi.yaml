          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        alzheimers:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        dementia:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        cancer:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        drink_alcohol:
          type: string
          description: "Accepted values: yes, no, or empty string if unknown"
          example: "no"
        body_height_in:
          type: number
          description: Body height in inches
        body_height_ft:
          type: number
          description: Body height in feet
    LtcCostInput:
      type: object
      description: >-
        The cost model only uses zipcode. Other fields of the shared input template are accepted and ignored.
      required:
        - zipcode
      properties:
        zipcode:
          type: string
    LtcDurationInput:
      type: object
      description: >-
        All model query endpoints accept the same input template. Fields not listed here are accepted and ignored. Optional fields left out or sent as an empty string are treated as unknown.
      required:
        - age
        - gender
        - zipcode
        - overall_rating
      properties:
        age:
          type: integer
          minimum: 18
